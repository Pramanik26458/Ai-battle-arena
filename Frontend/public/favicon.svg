<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="mbFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#090d16" stroke="url(#mbGrad)" stroke-width="2.5" />
  <rect x="5" y="5" width="54" height="54" rx="14" fill="url(#mbGrad)" fill-opacity="0.1" />

  <!-- Stylized "M" + Benchmark Nodes -->
  <g filter="url(#mbFilter)">
    <!-- Main M Polyline with glowing gradient -->
    <path d="M17 45 L17 21 L32 34 L47 21 L47 45" stroke="url(#neonGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Benchmark Gauge / Pulse Base Line -->
    <path d="M22 47 L42 47" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" />

    <!-- Left & Right Model Nodes -->
    <circle cx="17" cy="21" r="3" fill="#818cf8" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="47" cy="21" r="3" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5" />

    <!-- Center Verdict / Benchmark Point -->
    <circle cx="32" cy="34" r="3.5" fill="#ffffff" />
    <circle cx="32" cy="34" r="6" stroke="#c084fc" stroke-width="1.5" opacity="0.75" />
  </g>
</svg>
